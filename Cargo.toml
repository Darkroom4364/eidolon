[workspace]
members = [
    "crates/eidolon-core",
    "crates/eidolon-bait",
    "crates/eidolon-trace",
    "crates/eidolon-proxy",
    "examples/demo-target",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Darkroom4364/eidolon"
rust-version = "1.95"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
