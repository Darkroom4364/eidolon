[workspace]
members = [
    "crates/eidolon-core",
    "crates/eidolon-bait",
    "crates/eidolon-trace",
    "crates/eidolon-semantic-canary",
    "crates/eidolon-proxy",
    "examples/demo-target",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Darkroom4364/eidolon"
rust-version = "1.95"

[workspace.dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "=1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Positive HTTP/1 read-budget repair; provenance and retirement criteria:
# vendor/hyper/EIDOLON_PROVENANCE. Keep this exact pin while patched.
[patch.crates-io]
hyper = { path = "vendor/hyper" }
