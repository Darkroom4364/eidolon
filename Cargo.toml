[workspace]
members = [
    "crates/eidolon-core",
    "crates/eidolon-bait",
    "crates/eidolon-trace",
    "crates/eidolon-proxy",
    "examples/demo-target",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Darkroom4364/eidolon"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
