name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  checks: read
  contents: read

jobs:
  foxguard:
    name: Foxguard
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Foxguard GitHub App check
        env:
          GH_TOKEN: ${{ github.token }}
          FOXGUARD_APP_SLUG: ${{ vars.FOXGUARD_APP_SLUG || 'foxguard' }}
          FOXGUARD_CHECK_NAME: ${{ vars.FOXGUARD_CHECK_NAME || '' }}
          FOXGUARD_ACCEPTABLE_CONCLUSIONS: ${{ vars.FOXGUARD_ACCEPTABLE_CONCLUSIONS || 'success' }}
          FOXGUARD_REQUIRED: ${{ vars.FOXGUARD_REQUIRED || '0' }}
          FOXGUARD_MAX_WAIT_SECONDS: ${{ vars.FOXGUARD_MAX_WAIT_SECONDS || '600' }}
          FOXGUARD_POLL_SECONDS: ${{ vars.FOXGUARD_POLL_SECONDS || '15' }}
          FOXGUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FOXGUARD_FALLBACK_SHA: ${{ github.sha }}
        run: scripts/ci/wait-for-github-app-check.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  m3-fixtures:
    name: M3 fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep sqlite3

      - name: Validate M3 JSON fixtures
        run: |
          jq empty \
            examples/m3/bait-promotion-variants.json \
            examples/m3/bait-profiles/*.json

      - name: Check shell syntax
        run: bash -n scripts/ci/*.sh examples/lib/*.sh examples/m3/*.sh examples/baselines/*.sh examples/metrics/*.sh

      - name: Run M3 fixture tests
        run: |
          for test_script in examples/m3/test-*.sh; do
            "$test_script"
          done

      - name: Verify archived M3 evidence checksums
        run: |
          find docs/evidence/m3 -name SHA256SUMS -print0 | while IFS= read -r -d '' sums; do
            (
              cd "$(dirname "$sums")"
              sha256sum -c SHA256SUMS
            )
          done

  shield-lab-k8s:
    name: Shield lab k8s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ripgrep

      - name: Validate shield-lab manifests
        run: examples/shield-lab/validate-k8s-manifests.sh

      - name: Run kind deploy fixture test
        run: examples/shield-lab/test-deploy-kind.sh

      - name: Run authenticated trusted-ingress fixture tests
        run: |
          bash examples/shield-lab/test-smoke-trusted-ingress-explicit-rule-orbstack.sh
          bash examples/shield-lab/test-smoke-trusted-ingress-expired-claim-orbstack.sh
          bash examples/shield-lab/test-smoke-trusted-ingress-explicit-method-gate-orbstack.sh
          bash examples/shield-lab/test-smoke-trusted-ingress-explicit-path-gate-orbstack.sh
          bash examples/shield-lab/test-smoke-trusted-ingress-explicit-method-export-orbstack.sh
          bash examples/shield-lab/test-smoke-trusted-ingress-explicit-path-export-orbstack.sh
