name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  checks: read
  contents: read

jobs:
  foxguard:
    name: Foxguard
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Foxguard GitHub App check
        env:
          GH_TOKEN: ${{ github.token }}
          FOXGUARD_APP_SLUG: ${{ vars.FOXGUARD_APP_SLUG || 'foxguard' }}
          FOXGUARD_CHECK_NAME: ${{ vars.FOXGUARD_CHECK_NAME || '' }}
          FOXGUARD_ACCEPTABLE_CONCLUSIONS: ${{ vars.FOXGUARD_ACCEPTABLE_CONCLUSIONS || 'success' }}
          FOXGUARD_REQUIRED: ${{ vars.FOXGUARD_REQUIRED || '0' }}
          FOXGUARD_MAX_WAIT_SECONDS: ${{ vars.FOXGUARD_MAX_WAIT_SECONDS || '600' }}
          FOXGUARD_POLL_SECONDS: ${{ vars.FOXGUARD_POLL_SECONDS || '15' }}
          FOXGUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FOXGUARD_FALLBACK_SHA: ${{ github.sha }}
        run: scripts/ci/wait-for-github-app-check.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  m3-fixtures:
    name: M3 fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep sqlite3

      - name: Validate M3 JSON fixtures
        run: |
          jq empty \
            examples/m3/bait-promotion-variants.json \
            examples/m3/bait-profiles/*.json

      - name: Check shell syntax
        run: bash -n scripts/ci/*.sh examples/lib/*.sh examples/m3/*.sh examples/baselines/*.sh examples/metrics/*.sh

      - name: Run M3 fixture tests
        run: |
          examples/m3/test-run-pwnkit-sample.sh
          examples/m3/test-run-pwnkit-promotion-matrix.sh
          examples/m3/test-check-pwnkit-summary-health.sh
          examples/m3/test-check-pwnkit-sample-health.sh
          examples/m3/test-check-pwnkit-promotion-matrix-health.sh
          examples/m3/test-check-pwnkit-runner-freshness.sh
          examples/m3/test-shell-harness-safety.sh
          examples/m3/test-pwnkit-codex.sh
          examples/m3/test-collect-action-trace.sh
          examples/m3/test-collect-pwnkit-codex.sh
          examples/m3/test-collect-pwnkit-sample.sh
          examples/m3/test-collect-pwnkit-promotion-matrix.sh
          examples/m3/test-package-pwnkit-sample.sh
          examples/m3/test-package-pwnkit-promotion-matrix.sh
          examples/m3/test-packaged-evidence-redaction.sh
          examples/m3/test-research-doc-redaction.sh
          examples/m3/test-report.sh

      - name: Verify archived M3 evidence checksums
        run: |
          find docs/evidence/m3 -name SHA256SUMS -print0 | while IFS= read -r -d '' sums; do
            (
              cd "$(dirname "$sums")"
              sha256sum -c SHA256SUMS
            )
          done
