apiVersion: v1
kind: Service
metadata:
  name: eidolon-shield-edge
  namespace: shield-system
  labels:
    app.kubernetes.io/name: eidolon-shield-edge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: eidolon-shield-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31080
