apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-controlled-reality
  namespace: shield-controlled-reality
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eidolon-controlled-reality
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shield-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: eidolon-shield-proxy
      ports:
        - protocol: TCP
          port: 9103
