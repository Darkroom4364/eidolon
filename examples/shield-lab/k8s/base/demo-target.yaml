apiVersion: apps/v1
kind: Deployment
metadata:
  name: eidolon-owned-demo-target
  namespace: shield-targets
  labels:
    app.kubernetes.io/name: eidolon-owned-demo-target
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eidolon-owned-demo-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eidolon-owned-demo-target
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: owned-demo-target
          image: eidolon-owned-demo-target
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: EIDOLON_LAB_TARGET_ADDR
              value: "0.0.0.0:9101"
            - name: EIDOLON_OWNED_CLUSTER_LAB
              value: "1"
          ports:
            - containerPort: 9101
              name: http
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eidolon-owned-demo-target
  namespace: shield-targets
spec:
  selector:
    app.kubernetes.io/name: eidolon-owned-demo-target
  ports:
    - port: 9101
      targetPort: http
      name: http
