apiVersion: apps/v1
kind: Deployment
metadata:
  name: eidolon-shield-proxy
  namespace: shield-system
  labels:
    app.kubernetes.io/name: eidolon-shield-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eidolon-shield-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eidolon-shield-proxy
    spec:
      containers:
        - name: shield-proxy
          image: eidolon-shield-proxy:local
          imagePullPolicy: IfNotPresent
          args:
            - --owned-cluster-lab
            - --listen-addr
            - $(EIDOLON_LISTEN_ADDR)
            - --upstream
            - $(EIDOLON_UPSTREAM_TARGET)
            - --event-log
            - $(EIDOLON_EVENT_LOG_PATH)
            - --debug-log
            - $(EIDOLON_DEBUG_LOG_PATH)
            - --intervention-control
            - $(EIDOLON_INTERVENTION_CONTROL_PATH)
            - --policy-state
            - $(EIDOLON_POLICY_STATE_PATH)
          ports:
            - containerPort: 9102
              name: http
          env:
            - name: EIDOLON_LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_LISTEN_ADDR
            - name: EIDOLON_UPSTREAM_TARGET
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_UPSTREAM_TARGET
            - name: EIDOLON_EVENT_LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_EVENT_LOG_PATH
            - name: EIDOLON_DEBUG_LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_DEBUG_LOG_PATH
            - name: EIDOLON_POLICY_STATE_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_POLICY_STATE_PATH
            - name: EIDOLON_INTERVENTION_CONTROL_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_INTERVENTION_CONTROL_PATH
          volumeMounts:
            - name: eidolon-state
              mountPath: /var/lib/eidolon
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: eidolon-state
          persistentVolumeClaim:
            claimName: eidolon-shield-proxy-state
---
apiVersion: v1
kind: Service
metadata:
  name: eidolon-shield-proxy
  namespace: shield-system
spec:
  selector:
    app.kubernetes.io/name: eidolon-shield-proxy
  ports:
    - port: 9102
      targetPort: http
      name: http
