apiVersion: apps/v1
kind: Deployment
metadata:
  name: eidolon-shield-proxy
  namespace: shield-system
  labels:
    app.kubernetes.io/name: eidolon-shield-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eidolon-shield-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eidolon-shield-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: normalize-eidolon-state
          image: eidolon-shield-proxy
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              state_dir=/var/lib/eidolon
              if [ -L "$state_dir" ] || [ ! -d "$state_dir" ]; then
                echo "refusing invalid Eidolon state directory: $state_dir" >&2
                exit 1
              fi
              normalize_state_file() {
                if [ -L "$1" ]; then
                  echo "refusing symlinked Eidolon state path: $1" >&2
                  exit 1
                fi
                if [ -e "$1" ]; then
                  [ -f "$1" ]
                  chown 0:0 "$1"
                  chmod 0600 "$1"
                  chown 65532:65532 "$1"
                fi
              }
              for state_path in \
                "$state_dir/events.jsonl" \
                "$state_dir/events.jsonl.exposures.json" \
                "$state_dir/events.jsonl.exposures.json.tmp" \
                "$state_dir/events.jsonl.consumed-proofs.json" \
                "$state_dir/events.jsonl.consumed-proofs.json.tmp" \
                "$state_dir/debug.jsonl" \
                "$state_dir/policy-state.json" \
                "$state_dir/policy-state.tmp" \
                "$state_dir/policy-state.json.lock" \
                "$state_dir/policy-state.json.continuity.json" \
                "$state_dir/policy-state.json.continuity.json.tmp" \
                "$state_dir/interventions.txt"; do
                normalize_state_file "$state_path"
              done
              for archive_path in "$state_dir"/events.jsonl.* "$state_dir"/debug.jsonl.*; do
                archive_name=${archive_path##*/}
                archive_suffix=${archive_name#*.jsonl.}
                case "$archive_suffix" in
                  ""|*[!0123456789]*)
                    continue
                    ;;
                esac
                normalize_state_file "$archive_path"
              done
              chown 0:0 "$state_dir"
              chmod 0770 "$state_dir"
              chown 65532:65532 "$state_dir"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: eidolon-state
              mountPath: /var/lib/eidolon
      containers:
        - name: shield-proxy
          image: eidolon-shield-proxy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --owned-cluster-lab
            - --listen-addr
            - $(EIDOLON_LISTEN_ADDR)
            - --upstream
            - $(EIDOLON_UPSTREAM_TARGET)
            - --event-log
            - $(EIDOLON_EVENT_LOG_PATH)
            - --debug-log
            - $(EIDOLON_DEBUG_LOG_PATH)
            - --bait-profile
            - /etc/eidolon/bait-profile.json
            - --bait-signing-secret-file
            - /var/run/secrets/eidolon-bait-signing/signing-secret.txt
            - --intervention-control
            - $(EIDOLON_INTERVENTION_CONTROL_PATH)
            - --policy-state
            - $(EIDOLON_POLICY_STATE_PATH)
            - --session-signing-key-file
            - /var/run/secrets/eidolon-session-signing/key-ring.json
            - --ingress-transport-auth-secret-file
            - /var/run/secrets/eidolon-trusted-ingress/transport-auth.txt
            - --ingress-continuity-key-file
            - /var/run/secrets/eidolon-trusted-ingress/continuity-key.txt
            - --ingress-trust-config
            - /etc/eidolon-ingress-trust/ingress-trust.json
          ports:
            - containerPort: 9102
              name: http
          env:
            - name: EIDOLON_LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_LISTEN_ADDR
            - name: EIDOLON_UPSTREAM_TARGET
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_UPSTREAM_TARGET
            - name: EIDOLON_EVENT_LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_EVENT_LOG_PATH
            - name: EIDOLON_DEBUG_LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_DEBUG_LOG_PATH
            - name: EIDOLON_POLICY_STATE_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_POLICY_STATE_PATH
            - name: EIDOLON_INTERVENTION_CONTROL_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_INTERVENTION_CONTROL_PATH
          volumeMounts:
            - name: eidolon-state
              mountPath: /var/lib/eidolon
            - name: eidolon-bait-profile
              mountPath: /etc/eidolon
              readOnly: true
            - name: eidolon-bait-signing
              mountPath: /var/run/secrets/eidolon-bait-signing
              readOnly: true
            - name: eidolon-session-signing
              mountPath: /var/run/secrets/eidolon-session-signing
              readOnly: true
            - name: eidolon-trusted-ingress
              mountPath: /var/run/secrets/eidolon-trusted-ingress
              readOnly: true
            - name: eidolon-ingress-trust
              mountPath: /etc/eidolon-ingress-trust
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: eidolon-state
          persistentVolumeClaim:
            claimName: eidolon-shield-proxy-state
        - name: eidolon-bait-profile
          configMap:
            name: eidolon-shield-bait-profile
            items:
              - key: bait-profile.json
                path: bait-profile.json
        - name: eidolon-bait-signing
          secret:
            secretName: eidolon-bait-signing
        - name: eidolon-session-signing
          secret:
            secretName: eidolon-session-signing
            items:
              - key: key-ring.json
                path: key-ring.json
        - name: eidolon-trusted-ingress
          secret:
            secretName: eidolon-trusted-ingress
            items:
              - key: transport-auth.txt
                path: transport-auth.txt
              - key: continuity-key.txt
                path: continuity-key.txt
        - name: eidolon-ingress-trust
          configMap:
            name: eidolon-shield-ingress-trust-config
            items:
              - key: ingress-trust.json
                path: ingress-trust.json
---
apiVersion: v1
kind: Service
metadata:
  name: eidolon-shield-proxy
  namespace: shield-system
spec:
  selector:
    app.kubernetes.io/name: eidolon-shield-proxy
  ports:
    - port: 9102
      targetPort: http
      name: http
