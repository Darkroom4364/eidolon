apiVersion: apps/v1
kind: Deployment
metadata:
  name: eidolon-shield-proxy
  namespace: shield-system
  labels:
    app.kubernetes.io/name: eidolon-shield-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eidolon-shield-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eidolon-shield-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shield-proxy
          image: eidolon-shield-proxy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --owned-cluster-lab
            - --listen-addr
            - $(EIDOLON_LISTEN_ADDR)
            - --upstream
            - $(EIDOLON_UPSTREAM_TARGET)
            - --event-log
            - $(EIDOLON_EVENT_LOG_PATH)
            - --debug-log
            - $(EIDOLON_DEBUG_LOG_PATH)
            - --bait-profile
            - /etc/eidolon/bait-profile.json
            - --bait-signing-secret-file
            - /var/run/secrets/eidolon-bait-signing/signing-secret.txt
            - --intervention-control
            - $(EIDOLON_INTERVENTION_CONTROL_PATH)
            - --policy-state
            - $(EIDOLON_POLICY_STATE_PATH)
            - --ingress-transport-auth-secret-file
            - /var/run/secrets/eidolon-trusted-ingress/transport-auth.txt
            - --ingress-trust-config
            - /etc/eidolon-ingress-trust/ingress-trust.json
          ports:
            - containerPort: 9102
              name: http
          env:
            - name: EIDOLON_LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_LISTEN_ADDR
            - name: EIDOLON_UPSTREAM_TARGET
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_UPSTREAM_TARGET
            - name: EIDOLON_EVENT_LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_EVENT_LOG_PATH
            - name: EIDOLON_DEBUG_LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_DEBUG_LOG_PATH
            - name: EIDOLON_POLICY_STATE_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_POLICY_STATE_PATH
            - name: EIDOLON_INTERVENTION_CONTROL_PATH
              valueFrom:
                configMapKeyRef:
                  name: eidolon-shield-proxy-config
                  key: EIDOLON_INTERVENTION_CONTROL_PATH
          volumeMounts:
            - name: eidolon-state
              mountPath: /var/lib/eidolon
            - name: eidolon-bait-profile
              mountPath: /etc/eidolon
              readOnly: true
            - name: eidolon-bait-signing
              mountPath: /var/run/secrets/eidolon-bait-signing
              readOnly: true
            - name: eidolon-trusted-ingress
              mountPath: /var/run/secrets/eidolon-trusted-ingress
              readOnly: true
            - name: eidolon-ingress-trust
              mountPath: /etc/eidolon-ingress-trust
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: eidolon-state
          persistentVolumeClaim:
            claimName: eidolon-shield-proxy-state
        - name: eidolon-bait-profile
          configMap:
            name: eidolon-shield-bait-profile
            items:
              - key: bait-profile.json
                path: bait-profile.json
        - name: eidolon-bait-signing
          secret:
            secretName: eidolon-bait-signing
        - name: eidolon-trusted-ingress
          secret:
            secretName: eidolon-trusted-ingress
        - name: eidolon-ingress-trust
          configMap:
            name: eidolon-shield-ingress-trust-config
            items:
              - key: ingress-trust.json
                path: ingress-trust.json
---
apiVersion: v1
kind: Service
metadata:
  name: eidolon-shield-proxy
  namespace: shield-system
spec:
  selector:
    app.kubernetes.io/name: eidolon-shield-proxy
  ports:
    - port: 9102
      targetPort: http
      name: http
